<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#5c9a45;font-family:"Rubik","Heebo","Segoe UI","Arial Hebrew",Arial,sans-serif;color:#3a2a18}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;touch-action:none;display:block}
#hud{position:fixed;top:0;left:0;right:0;margin:0 auto;max-width:640px;padding:calc(var(--safe-area-inset-top,env(safe-area-inset-top)) + 8px) calc(var(--safe-area-inset-right,env(safe-area-inset-right)) + 8px) 0 calc(var(--safe-area-inset-left,env(safe-area-inset-left)) + 8px);pointer-events:none;z-index:5}
.row{display:flex;gap:7px;align-items:stretch}
.pill{position:relative;background:linear-gradient(#fffdf7,#f6e7c6);border:2px solid #fff;border-radius:18px;padding:5px 10px 5px 9px;box-shadow:0 3px 0 #c99d5e,0 6px 14px rgba(40,30,10,.25);display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px;white-space:nowrap;color:#4a3216}
.pill::after{content:"";position:absolute;left:8px;right:8px;top:2px;height:40%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
.pill.bump{animation:bump .35s}
@keyframes bump{30%{transform:scale(1.14)}60%{transform:scale(.96)}100%{transform:scale(1)}}
.ic{width:24px;height:24px;flex:none;display:block;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.grow{flex:1;flex-direction:column;align-items:stretch;gap:3px;padding:4px 10px 6px}
.lbl{font-size:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;color:#6b4a22}
.lbl .ic{width:16px;height:16px}
.bar{height:11px;background:linear-gradient(#d9c8a6,#e9dcc2);border-radius:8px;overflow:hidden;position:relative;box-shadow:inset 0 2px 2px rgba(0,0,0,.18)}
.bar i{position:absolute;top:0;bottom:0;right:0;border-radius:8px;background:linear-gradient(#9cf06e,#4cb53a 60%,#3d9a2e);transition:width .5s cubic-bezier(.2,1.4,.4,1)}
.bar i::after{content:"";position:absolute;inset:0;border-radius:8px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 6px,transparent 6px 12px);animation:stripes 1s linear infinite}
.bar i::before{content:"";position:absolute;left:3px;right:3px;top:1px;height:3px;border-radius:3px;background:rgba(255,255,255,.55)}
@keyframes stripes{to{background-position:24px 0}}
#hRate.up{animation:pulseG .7s}#hRate.down{animation:pulseR .7s}
@keyframes pulseG{0%{background:linear-gradient(#d6ffc4,#9be27e);transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pulseR{0%{background:linear-gradient(#ffd0c8,#ff8f80);transform:scale(1.18)}100%{transform:scale(1)}}
#btnPause{pointer-events:auto;border:2px solid #fff;border-radius:16px;background:linear-gradient(#8fd8ff,#3c9ee8);width:44px;box-shadow:0 3px 0 #2a6fae,0 6px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#btnPause:active{transform:translateY(2px);box-shadow:0 1px 0 #2a6fae}
.row2{display:flex;gap:8px;align-items:center;margin-top:7px}
.daypill{display:flex;align-items:center;gap:6px;background:rgba(30,40,70,.55);border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap}
.daypill .ic{width:18px;height:18px}
.row2 .bar{flex:1;height:7px;background:rgba(255,255,255,.3);box-shadow:none}
.row2 .bar i{background:linear-gradient(#fff3a0,#ffc61a)}
.row2 .bar i::after,.row2 .bar i::before{display:none}
#feed{margin-top:7px;font-size:12.5px;font-weight:700;color:#fff;background:linear-gradient(90deg,rgba(80,50,140,.78),rgba(50,30,90,.72));border:1.5px solid rgba(255,255,255,.3);border-radius:12px;padding:4px 10px;display:inline-block;max-width:100%;opacity:0;transform:translateY(-6px);transition:all .4s;box-shadow:0 4px 10px rgba(0,0,0,.2)}
#feed.on{opacity:1;transform:none}
#banner{position:fixed;left:0;right:0;margin:0 auto;max-width:600px;width:calc(100% - 16px);top:calc(var(--safe-area-inset-top,env(safe-area-inset-top)) + 116px);z-index:6;display:flex;gap:10px;align-items:center;background:linear-gradient(#fffdf6,#fbeed2);border:2.5px solid #fff;border-radius:20px;padding:8px 12px 8px 10px;box-shadow:0 4px 0 #d2a870,0 10px 24px rgba(0,0,0,.25);transform:translateY(-18px) scale(.96);opacity:0;transition:all .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#banner.on{transform:none;opacity:1}
#banner .face{width:54px;height:54px;border-radius:50%;flex:none;border:3px solid #fff;box-shadow:0 0 0 3px var(--ring,#e0a050),0 4px 8px rgba(0,0,0,.25);background-size:cover;background-position:center}
#banner .nm{display:inline-block;font-weight:900;font-size:12.5px;color:#fff;background:var(--ring,#e0a050);border-radius:10px;padding:1px 9px;margin-bottom:3px}
#banner .tx{font-size:14.5px;font-weight:700;line-height:1.32;color:#4a3216}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) + 205px);transform:translate(-50%,10px) scale(.9);z-index:7;background:linear-gradient(rgba(60,40,100,.95),rgba(35,22,65,.95));border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:800;font-size:15px;padding:10px 16px;border-radius:16px;max-width:min(86vw,520px);text-align:center;opacity:0;transition:all .3s cubic-bezier(.2,1.4,.4,1);pointer-events:none;line-height:1.35;box-shadow:0 8px 20px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
#hint{position:fixed;left:50%;bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) + 150px);transform:translateX(-50%);z-index:5;background:linear-gradient(#fffef4,#ffe9a8);border:2.5px solid #fff;color:#5a3a10;font-weight:900;font-size:15px;padding:8px 16px;border-radius:18px;box-shadow:0 4px 0 #d9a440,0 8px 18px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none;display:none;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
#modal{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at center,rgba(30,20,50,.45),rgba(15,10,30,.78));display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-area-inset-top,env(safe-area-inset-top)) + 16px) calc(var(--safe-area-inset-right,env(safe-area-inset-right)) + 16px) calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) + 16px) calc(var(--safe-area-inset-left,env(safe-area-inset-left)) + 16px)}
.card{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.btn{touch-action:manipulation}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:linear-gradient(#7cc8ff,#5c9a45);color:#fff;font-weight:900;font-size:22px;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#rotate i{font-style:normal;font-size:56px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{50%{transform:rotate(-90deg)}}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){#rotate{display:flex}}
#modal.hidden{display:none}
.card{position:relative;background:linear-gradient(#fffaf0,#fbefd6);border:3px solid #fff;border-radius:26px;max-width:420px;width:100%;padding:18px 18px 16px;box-shadow:0 7px 0 #d0a565,0 18px 40px rgba(0,0,0,.4);max-height:92vh;overflow:auto;animation:pop .38s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.7) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.card h2{margin:4px 0 8px;font-size:25px;color:#6b3d12;text-align:center;font-weight:900;letter-spacing:.3px;text-shadow:0 2px 0 #fff}
.card p{margin:8px 0;font-size:16px;line-height:1.48;font-weight:500}
.card .ill{height:150px;border-radius:18px;margin:-4px -4px 12px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.15)}
.card .ill img{width:100%;height:100%;object-fit:cover;display:block}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btn{position:relative;border:2.5px solid #fff;border-radius:18px;padding:13px;font-size:17.5px;font-weight:900;font-family:inherit;background:linear-gradient(#9ff07a,#55bf3c 55%,#45a530);color:#fff;text-shadow:0 2px 0 rgba(0,70,0,.35);box-shadow:0 5px 0 #2f7d22,0 8px 16px rgba(0,0,0,.22);cursor:pointer;overflow:hidden}
.btn::after{content:"";position:absolute;left:10px;right:10px;top:3px;height:42%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2f7d22}
.btn.alt{background:linear-gradient(#fff6e2,#ecd9b2);color:#6b3d12;text-shadow:none;box-shadow:0 5px 0 #c4a170,0 8px 16px rgba(0,0,0,.15)}
.btn.bad{background:linear-gradient(#4a4360,#27223a);color:#ffd34d;text-shadow:0 2px 0 #000;box-shadow:0 5px 0 #0e0b18,0 8px 16px rgba(0,0,0,.3)}
.small{font-size:13.5px;color:#82684a}
.dots{display:flex;gap:7px;justify-content:center;margin-top:12px}.dots i{width:9px;height:9px;border-radius:50%;background:#e2cfa8;transition:all .3s}.dots i.on{background:#55bf3c;width:24px;border-radius:6px}
.por{display:block;width:92px;height:92px;border-radius:50%;margin:-6px auto 4px;border:4px solid #fff;box-shadow:0 0 0 4px var(--ring,#e0a050),0 8px 16px rgba(0,0,0,.25)}
.duo{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 6px}
.duo div{text-align:center;font-weight:900;font-size:13px}
.duo img{width:78px;height:78px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 4px var(--ring),0 6px 12px rgba(0,0,0,.25);display:block;margin:0 auto 6px}
.vs{font-size:22px;font-weight:900;color:#fff;background:linear-gradient(#ff8a5c,#e0412b);border:3px solid #fff;border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #a52a17}
.chars{margin:10px 0;display:flex;flex-direction:column;gap:8px}
.chr{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 2px 0 #ead8b6}
.chr .face{width:46px;height:46px;border-radius:50%;flex:none;border:3px solid #fff;box-shadow:0 0 0 2px #e5d3ae}
.chr b{font-size:14px}.chr div{font-size:13px;line-height:1.35}
.chr.left .face{filter:grayscale(1);opacity:.7}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:1px 8px;border-radius:9px;margin-inline-start:5px}
.t-ok{background:#c9f0b8;color:#2c6b1a}.t-no{background:#f5c3bd;color:#8c2318}.t-mid{background:#eee0c4;color:#6b5530}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stats div{background:#fff;border-radius:14px;padding:7px 8px;font-size:13px;text-align:center;font-weight:700;color:#8a6a45;box-shadow:0 2px 0 #ead8b6}.stats b{display:block;font-size:21px;color:#4a3216}
.tease{background:linear-gradient(135deg,#34508a,#1b2448);color:#dfe8ff;border-radius:18px;padding:12px 14px;margin-top:10px;border:2px solid rgba(255,255,255,.25);box-shadow:inset 0 0 30px rgba(120,170,255,.25)}
.tease h3{margin:0 0 4px;color:#a8d8ff;font-size:16px}
.endh{font-size:30px!important}

/* v3.1 */
#nextC{margin-top:6px;align-self:flex-start;display:none;gap:6px;align-items:center;background:rgba(40,28,70,.82);color:#fff;font-weight:800;font-size:13px;padding:4px 10px 4px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.35);pointer-events:none;width:max-content;max-width:90vw}
#nextC.on{display:flex}#nextC img{width:24px;height:24px;border-radius:50%;border:2px solid var(--ring,#fff);background:#fff}
.btn.off{filter:grayscale(.75) brightness(.92);opacity:.8}
.upgs{display:grid;gap:8px;margin:8px 0}
.upg{border:2.5px solid var(--uc);border-radius:14px;padding:7px 10px;background:linear-gradient(#fff,#fbf6ea);text-align:right;font-size:14px;line-height:1.35}
.upg.done{opacity:.7}.upg .uh{display:flex;justify-content:space-between;font-weight:900;color:var(--uc);font-size:15px}
.upg .ud{color:#5a4a3a;font-size:13px}.upg .uc{font-weight:900;color:#7a5200;margin-top:2px}
.pips{display:flex;gap:3px;align-items:center}.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--uc);background:#fff}.pips i.on{background:var(--uc)}
.disc{font-size:11px;background:#ffe8a8;color:#7a5200;border-radius:8px;padding:0 6px;font-weight:800}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}.ach{font-size:11.5px;border-radius:10px;padding:5px 7px;background:#eee;color:#888;text-align:right;line-height:1.25}.ach b{display:block;font-size:12.5px}.ach.on{background:linear-gradient(#fff6c8,#ffe27a);color:#6a4a00}
i.mem{color:#6a5a8a;font-size:12.5px}.achnew{color:#a8740a;font-size:16px;margin:8px 0 0}

:root{--ts:1}#mCard,#toast,#hint,#banner,#feed,#nextC{zoom:var(--ts)}
#capt{position:fixed;left:calc(var(--safe-area-inset-left,env(safe-area-inset-left)) + 10px);bottom:calc(var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) + 120px);z-index:6;background:rgba(0,0,0,.72);color:#fff;font-weight:800;font-size:calc(13px * var(--ts));padding:4px 10px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
#capt.on{opacity:1}

#modal:not(.hidden){animation:fadeBg .25s ease-out}@keyframes fadeBg{from{opacity:0}to{opacity:1}}
#modal.devbg{background:radial-gradient(ellipse at center,rgba(40,20,60,.6),rgba(10,5,20,.88))}
.card.dev{background:linear-gradient(#f7f3ff,#e9e0f7);box-shadow:0 7px 0 #6a5a8a,0 18px 40px rgba(0,0,0,.5)}
#dayCard{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;opacity:0;text-align:center;color:#fff;font-weight:900;font-size:calc(40px * var(--ts));text-shadow:0 3px 0 rgba(60,30,0,.55),0 0 24px rgba(255,200,80,.6);line-height:1}
#dayCard small{display:block;font-size:.38em;opacity:.9;margin-bottom:4px}
#dayCard.on{animation:dayIn 2.2s ease-out}@keyframes dayIn{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}25%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
@media (prefers-reduced-motion:reduce){#dayCard.on{animation-duration:1.2s}.card{animation:none}}

/* v3.2 audio toggles + onboarding */
.aBtn{pointer-events:auto;width:30px;height:26px;padding:0;border-radius:12px;border:1.5px solid rgba(255,255,255,.55);background:rgba(30,40,70,.55);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.aBtn.off{opacity:.55;filter:grayscale(1)}.aBtn.off::after{content:'';position:absolute;left:5px;right:5px;top:50%;height:2px;background:#ff6b5b;transform:rotate(-35deg);border-radius:2px}
#hint{white-space:normal;max-width:min(92vw,420px);width:max-content;align-items:center;gap:8px;text-align:center;line-height:1.3;padding:8px 10px 8px 12px}
#hStep{flex:none;background:#d9a440;color:#fff;font-size:11px;border-radius:9px;padding:2px 6px;direction:ltr}
#hTxt{flex:1}
#obSkip{pointer-events:auto;flex:none;border:0;background:rgba(90,58,16,.12);color:#7a5520;font-weight:800;font-size:12px;border-radius:10px;padding:5px 8px;cursor:pointer;font-family:inherit}
#hint.pop{animation:obPop .35s ease-out,bob 1.2s ease-in-out .35s infinite}
@keyframes obPop{0%{transform:translateX(-50%) scale(.85);opacity:.3}100%{transform:translateX(-50%) scale(1);opacity:1}}
#spot{position:fixed;left:0;top:0;width:100px;height:100px;border-radius:50%;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s,box-shadow .9s;box-shadow:0 0 0 200vmax rgba(15,10,30,.34),inset 0 0 18px 6px rgba(15,10,30,.25)}
#spot.soft{box-shadow:0 0 0 200vmax rgba(15,10,30,.14),inset 0 0 14px 4px rgba(15,10,30,.12)}
.obGlow{animation:obGlow 1s ease-in-out infinite;z-index:1}
@keyframes obGlow{0%,100%{box-shadow:0 3px 0 #c99d5e,0 0 0 3px #ffd84a,0 0 12px 4px rgba(255,216,74,.7)}50%{box-shadow:0 3px 0 #c99d5e,0 0 0 4px #fff3a8,0 0 24px 10px rgba(255,216,74,.95)}}
.obtip{background:#fff7d6;border:1.5px dashed #d9a440;border-radius:12px;padding:6px 10px;font-size:14px;color:#5a3a10}
@media (prefers-reduced-motion:reduce){#hint.pop,.obGlow{animation:none}}
</style>

<body>
<canvas id="c"></canvas>

  if(!S.tips.pie&&S.coop&&S.coins>=60){S.tips.pie=1;toast('אפשר לפתוח תנור פאי: חיטה + ביצה = פאי ששווה 10.',3.5);}
  if(!S.tips.ruin&&S.served>=6){S.tips.ruin=1;toast('את הבתים ההרוסים בכפר אפשר לשפץ — אבל משפחות יעברו רק אם הדירוג שלך ★3.8 ומעלה.',4.5);}
}

/* ================= update ================= */
let xferT=0,saveT=0,padMsgT=0,helperT=0,moving=false,fullMsgT=0;
function takeLast(type){const s=P().stack;const i=s.lastIndexOf(type);if(i<0)return false;s.splice(i,1);return true;}
function near(o,r){return dist(P().x,P().y,o.x,o.y)<r;}
function padVisible(k){const ps=S.pads[k];if(ps.done)return false;if(k==='coop')return!S.coop;if(k==='f2')return!S.f2;if(k==='pie')return S.coop&&!S.pie;if(k==='well')return S.drought&&!S.well;return true;}
function walk(c,x,y,sp,dt){const dx=x-c.x,dy=y-c.y,l=Math.hypot(dx,dy);if(l<1){c.x=x;c.y=y;c.mv=false;return;}const m=Math.min(l,sp*dt);c.x+=dx/l*m;c.y+=dy/l*m;c.mv=true;if(Math.abs(dx)>1)c.face=dx<0?-1:1;}
function unlock(k){
  const d=PADS[k];S.pads[k].done=true;ring(d.x,d.y,'#ffe14d',90,.8);beam(d.x,d.y,'rgba(255,220,120,.9)');cap('🎉 נפתח: '+d.label);S.stats.unlockT[k]=Math.round(S.t);burst(d.x,d.y,'#ffe14d',36,220);confetti(d.x,d.y,50);burst(d.x,d.y,'#fff',16,160);shake=.35;
  if(k==='coop'){S.coop=true;S.nests.forEach(n=>n.eggs=1);toast('הלול נפתח! עבור ליד הקנים כדי לאסוף ביצים.');}
  if(k==='f2'){S.f2=true;toast('שדה חיטה חדש!');}
  if(k==='pie'){S.pie=true;toast('תנור פאי! הכנס חיטה וביצים — וקבל פאי.');}
  if(k==='well'){S.well=true;S.drought=false;toast('הבאר של סבא עובדת שוב! החיטה צומחת כרגיל.');gossip(null,'החוואי תיקן את הבאר של סבא שלו!');}
  if(k.startsWith('ruin'))addRes(5,'משפחה חדשה עברה לבית המשופץ!');
  save();
}
function update(dt){
  S.t+=dt;const p=P();
  let mx=input.dx,my=input.dy;
  if(keys['arrowleft']||keys['a'])mx-=1;if(keys['arrowright']||keys['d'])mx+=1;if(keys['arrowup']||keys['w'])my-=1;if(keys['arrowdown']||keys['s'])my+=1;
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  moving=ml>.08;p.x=clamp(p.x+mx*S.speed*dt,18,WORLD.w-18);p.y=clamp(p.y+my*S.speed*dt,150,WORLD.h-20);
  if(Math.abs(mx)>.1)S.face=mx<0?-1:1;
  // fields
  for(const t of S.tiles){if(t.f==='f2'&&!S.f2)continue;
    if(!t.ripe){t.t-=dt/(S.drought?droughtMul():1);if(t.t<=0)t.ripe=true;}
    else if(Math.abs(p.x-t.x)<(S.up.log>=2?38:26)&&Math.abs(p.y-t.y)<(S.up.log>=2?34:24)){
      if(p.stack.length<S.cap){t.ripe=false;t.t=regrowTime();p.stack.push('wheat');burst(t.x,t.y-8,'#f2c84b',6,90);snd(600+p.stack.length*40,.05,'triangle',.04,'h');squash=.15;}
      else if(fullMsgT<=0){fullMsgT=1.6;floatText(p.x,p.y-95,`הסל מלא! (${S.cap})`,'#fff',14);}}}
  fullMsgT-=dt;
  if(S.coop)for(const n of S.nests){if(n.eggs<3){n.t+=dt;if(n.t>=4){n.t=0;n.eggs++;}}}
  const o=S.oven,OC=ovenCap();if(o.in>0&&o.out<OC){o.t+=dt;if(o.t>=bakeTime()){o.t=0;o.in--;o.out++;o.hot=perfectWindow();burst(OVEN.x,OVEN.y-30,'#ffb347',5,60);if(!LOWFX)puff(OVEN.x+18,OVEN.y-78,6);}}else o.t=0;
  if(o.hot>0)o.hot-=dt;
  const v=S.pov;if(S.pie&&v.w>0&&v.e>0&&v.out<8){v.t+=dt;if(v.t>=pieTime()){v.t=0;v.w--;v.e--;v.out++;burst(PIE.x,PIE.y-30,'#ff7aa2',6,60);}}else v.t=0;
  if(S.helper){helperT+=dt;if(helperT>=6){helperT=0;if(o.in<OC){o.in++;fly('wheat',OVEN_IN.x+40,OVEN_IN.y-20,OVEN.x,OVEN.y-20,.5);}}}
  // transfers
  xferT-=dt;
  if(xferT<=0){
    if(near(OVEN_IN,32)&&o.in<OC&&takeLast('wheat')){o.in++;fly('wheat',p.x,p.y-60,OVEN.x,OVEN.y-20);xferT=.1;snd(420,.04,'triangle',.03,'x');}
    else if((near(OVEN_OUT,32)||(S.up.log>=3&&near(OVEN_OUT,60)))&&o.out>0&&p.stack.length<S.cap){o.out--;p.stack.push('bread');
      if(o.hot>0){S.coins++;S.stats.perfect++;floatText(OVEN_OUT.x,OVEN_OUT.y-50,'מושלם! +1','#ffd34d',15);cap('✨ לחם מושלם');ring(OVEN_OUT.x,OVEN_OUT.y,'#fff3b0',36,.45);burst(OVEN_OUT.x,OVEN_OUT.y-20,'#fff3b0',6,80);}fly('bread',OVEN_OUT.x,OVEN_OUT.y-10,p.x,p.y-60);xferT=.1;snd(700,.05,'triangle',.04,'x');squash=.12;}
    else if(S.pie&&near(PIE_IN,32)&&((v.w<6&&p.stack.includes('wheat'))||(v.e<6&&p.stack.includes('egg')))){let t='wheat';if(v.e<6&&(v.e<=v.w||v.w>=6)&&takeLast('egg')){v.e++;t='egg';}else if(v.w<6&&takeLast('wheat'))v.w++;else if(v.e<6&&takeLast('egg')){v.e++;t='egg';}fly(t,p.x,p.y-60,PIE.x,PIE.y-20);xferT=.12;snd(420,.04,'triangle',.03,'x');}
    else if(S.pie&&near(PIE_OUT,32)&&v.out>0&&p.stack.length<S.cap){v.out--;p.stack.push('pie');xferT=.12;snd(760,.05,'triangle',.04,'x');squash=.12;}
    else if(near(SERVE,38)){const f=queue()[0];if(f&&f.got<f.n&&takeLast(f.want)){f.got++;fly(f.want,p.x,p.y-60,f.x,f.y-30,.3);xferT=.16;snd(820,.05,'triangle',.04,'x');if(f.got>=f.n)complete(f);}}
    else if(near(TRASH,24)&&p.stack.length){const it=p.stack.pop();fly(it,p.x,p.y-60,TRASH.x,TRASH.y-12);xferT=.12;}
    if(S.coop&&xferT<=0)for(const n of S.nests){if(n.eggs>0&&p.stack.length<S.cap&&dist(p.x,p.y,n.x,n.y)<28){n.eggs--;p.stack.push('egg');xferT=.12;burst(n.x,n.y,'#fff',4,60);snd(900,.04,'triangle',.04,'x');squash=.12;break;}}
  }
  // pads
  padMsgT-=dt;
  for(const k in PADS){const d=PADS[k],ps=S.pads[k];if(!padVisible(k))continue;
    if(dist(p.x,p.y,d.x,d.y)<30){
      if(d.minR&&S.rating<d.minR){if(padMsgT<=0){padMsgT=2;floatText(d.x,d.y-40,`נדרש דירוג ★${d.minR}`,'#ff8a7a',15);snd(200,.1,'square',.03);}continue;}
      if(S.coins<=0){if(padMsgT<=0){padMsgT=2;floatText(d.x,d.y-40,'אין מספיק מטבעות','#fff',14);}continue;}
      const pc=padCost(k);const amt=Math.min(S.coins,Math.max(1,Math.ceil(pc*dt*1.1)),pc-ps.paid);S.coins-=amt;ps.paid+=amt;
      if(R()<.5)fly('coin',p.x,p.y-40,d.x,d.y,.3);snd(1000+ps.paid/pc*600,.03,'square',.02,'c');
      if(ps.paid>=pc)unlock(k);
    }}
  // customers
  const q=queue();
  q.forEach((c,i)=>{const s=SLOTS[Math.min(i,SLOTS.length-1)];walk(c,s[0],s[1],130,dt);if(c.st==='in'&&dist(c.x,c.y,s[0],s[1])<3)c.st='wait';c.wait+=dt;if(!c.sw&&c.wait>c.maxP*.72){c.sw=1;emote(c,'sweat',1.8);}if(c.wait>c.maxP)timeout(c);});
  for(const c of S.cust)if(c.st==='out'){walk(c,c.ex,c.ey,150,dt);if(dist(c.x,c.y,c.ex,c.ey)<4)c.dead=true;}
  S.cust=S.cust.filter(c=>!c.dead);
  // spawns
  if(S.t>=S.nextCust){if(queue().length<(S.mods.qCap||(S.day>=8?7:S.day>=5?6:5)))spawn(null);S.nextCust=S.t+((S.rating>=4?7:S.rating<2.8?12:9)+R()*3)*(S.mods.spawnMul||1)*demandMul();}
  for(const k of CH_KEYS){const ch=S.chars[k];if(ch.state==='away'&&S.t>=ch.next&&queue().length<7)spawn(k);}
  // events (one at a time)
  if(!S.ev.bribe1&&S.t>=115)bribe1();
  else if(!S.ev.dilemma&&S.t>=150)dilemma();
  else if(!S.ev.drought&&S.t>=(S.mods.droughtT||250))drought();
  else if(!S.ev.meeting&&S.t>=370)meeting();
  else if(S.ev.meeting&&!S.ev.bribe2&&S.meetT!=null&&S.t>=S.meetT+1.5){S.ev.bribe2=true;bribe2();}
  else if(!S.ev.rumor&&S.t>=430)rumor();
  else if(!S.ev.family&&S.t>=500)family();
  // upgrade board: opens when stepped on, re-arms once the player walks away
  if(boardVisible()){const db=dist(p.x,p.y,BOARD.x,BOARD.y);if(db<34&&boardArm&&!modalOpen){boardArm=false;openBoard();}else if(db>45)boardArm=true;}
  if(S.drought&&S.t>=(S.droughtEnd||440)&&!S.well){S.drought=false;toast('סוף סוף גשם! החיטה צומחת כרגיל.');S.rainT=22;}
  const d=S.free?Math.floor(S.t/DAY_LEN)+1:Math.min(DAYS,Math.floor(S.t/DAY_LEN)+1);if(d>S.day){S.day=d;dayEnd();}
  if(S.t>=DAYS*DAY_LEN&&!S.free){endSeason();return;}
  if(S.bribeT>0)S.bribeT-=dt;
  gossipCD-=dt;if(gossipCD<=0){gossipCD=8+R()*5;gossip(null,gossipLine());}
  tutorial();
  saveT+=dt;if(saveT>3){saveT=0;save();}
}

/* ---------- B. economy: 3 upgrade tracks (tiered, wheat used by community) ---------- */
const UPG={
  prod:{name:'ייצור',icon:'🔥',col:'#e0702a',tiers:[
    {c:60,t:'תנור מהיר',d:'אפייה 1.5 ← 1.1 שנ׳ לכיכר'},
    {c:120,t:'תנור כפול',d:'מגש לחם 12 ← 20 · אפייה 0.85 שנ׳'},
    {c:200,t:'מאפייה מקצועית',d:'לחם נמכר ב-5 (במקום 4) · תנור פאי מהיר פי 1.5'}]},
  log:{name:'לוגיסטיקה',icon:'🧺',col:'#2f86d6',tiers:[
    {c:50,t:'סל קש',d:'+2 מקומות בסל'},
    {c:110,t:'מגל רחב',d:'קוצרים משבצות סמוכות · הליכה מהירה ב-10%'},
    {c:180,t:'עגלת יד',d:'+3 מקומות · לחם נאסף מהתנור כשעוברים לידו'}]},

    {c:140,w:8,t:'כיכר הכפר',d:'+4 תושבים · אפשרות חדשה באספת הכפר'},
    {c:220,w:12,t:'מאפיית קהילה',d:'+6 תושבים · אפשרות "חלוקת לחם" באירועים'}]}
};
const BOARD={x:705,y:922};
function upgCost(track,tier){const T=UPG[track].tiers[tier];let m=S.mods.priceMul||1;
  if(track==='prod'&&S.path==='boaz')m*=.75;if(track==='com'&&S.path==='dana')m*=.75;
  return {c:Math.round(T.c*m),w:T.w||0};}
function padCost(k){return Math.round(PADS[k].cost*(S.mods.priceMul||1));}
function bakeTime(){return [1.5,1.1,.85,.85][S.up.prod];}
function ovenCap(){return S.up.prod>=2?20:12;}
function pieTime(){return S.up.prod>=3?1.6:2.4;}
function priceOf(item){return item==='bread'&&S.up.prod>=3?5:PRICE[item];}
function recomputeStats(){
  const bs=S.chars.blacksmith.state==='stayed';
  S.cap=(bs?10:6)+(S.up.log>=1?2:0)+(S.up.log>=3?3:0);
  S.speed=(bs?190:165)*(S.up.log>=2?1.1:1);
}
function patienceMul(){return (S.up.com>=1?1.1:1)*(S.path==='dana'?1.1:1)*(S.mods.patMul||1);}
/* late-season demand ramp: from day 4 the village grows busier, so production/logistics matter */
function demandMul(){return S.day<=3?1:Math.max(.4,1-.09*(S.day-3));}
function regrowTime(){return S.chars.teacher.state==='stayed'?4:5;}   // teacher's kids water the fields
function droughtMul(){return S.path==='dana'?2:3;}
function perfectWindow(){return S.path==='boaz'?3:2;}
let boardArm=true;
function boardVisible(){return S.coop||S.t>=90;}
function openBoard(){
  const card=(k)=>{const U=UPG[k],lv=S.up[k];const pips=U.tiers.map((_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('');
    if(lv>=3)return `<div class="upg done" style="--uc:${U.col}"><div class="uh"><span>${U.icon} ${U.name}</span><span class="pips">${pips}</span></div><div class="ud">כל השדרוגים נרכשו</div></div>`;
    const T=U.tiers[lv],cs=upgCost(k,lv);const wheat=P().stack.filter(i=>i==='wheat').length;
    const disc=(k==='prod'&&S.path==='boaz')?' <span class="disc">בועז: ‎-25%</span>':(k==='com'&&S.path==='dana')?' <span class="disc">דנה: ‎-25%</span>':'';
    return `<div class="upg" style="--uc:${U.col}"><div class="uh"><span>${U.icon} ${U.name}</span><span class="pips">${pips}</span></div><b>${T.t}</b>${disc}<div class="ud">${T.d}</div><div class="uc">🪙 ${cs.c}${cs.w?` · 🌾 ${cs.w} <small>(בסל: ${wheat})</small>`:''}</div></div>`;};
  const btns=[];
  for(const k of ['prod','log','com']){const lv=S.up[k];if(lv>=3)continue;const cs=upgCost(k,lv);const wheat=P().stack.filter(i=>i==='wheat').length;
    const ok=S.coins>=cs.c&&wheat>=cs.w;
    btns.push({t:`${UPG[k].icon} ${UPG[k].tiers[lv].t} — ${cs.c}${cs.w?' + '+cs.w+'🌾':''}`,cls:ok?'':'off',fn:()=>{if(ok)buyUpg(k);else toast(S.coins<cs.c?'אין מספיק מטבעות':'צריך להביא חיטה בסל',2);}});}
  btns.push({t:'סגור',cls:'alt',fn:()=>{}});
  modal(`<h2>לוח השדרוגים</h2><p class="small">כל מסלול משנה את סגנון המשחק. אי אפשר לקנות הכול בעונה אחת — תבחר.</p><div class="upgs">${['prod','log','com'].map(card).join('')}</div>`,btns,'board');
}
function buyUpg(k){const lv=S.up[k],cs=upgCost(k,lv);if(S.coins<cs.c)return;
  for(let i=0;i<cs.w;i++)takeLast('wheat');S.coins-=cs.c;S.up[k]=lv+1;S.stats.upg.push(k+(lv+1)+'@'+Math.round(S.t));
  recomputeStats();const T=UPG[k].tiers[lv];
  if(k==='com'){addRes([3,4,6][lv],null);}
  ring(BOARD.x,BOARD.y,UPG[k].col,80,.7);beam(BOARD.x,BOARD.y,'rgba(255,220,120,.9)');burst(BOARD.x,BOARD.y-30,'#ffe14d',30,200);confetti(BOARD.x,BOARD.y-40,40);shake=.25;
  toast(`שודרג: ${T.t}!`,2.4);cap('🎉 שדרוג: '+T.t);if(k==='com')gossip(null,['ראיתם את הגינה החדשה?','הכיכר שוב מלאה אנשים','מאפיית קהילה! כמו פעם'][lv]);
  save();if(!modalOpen&&near(BOARD,34))openBoard();}

/* ---------- C. villager memory & trust ---------- */
const MEM_LINES={
  waitedLong:['בפעם הקודמת חיכיתי המון. בוא נראה מה יהיה היום.','אני עדיין זוכר כמה חיכיתי בפעם שעברה.'],
  helped:['בפעם שעברה זה היה מהיר. אני זוכר דברים כאלה.','שמעתי שאתה מקפיד על כולם. זה לא מובן מאליו.'],
  skippedOver:['ראיתי איך הקדמת מישהו לפניי. לא שכחתי.','גם הפעם תקדים מישהו לפניי?'],
  timeout:['הלכתי ממך בידיים ריקות. נותן לך עוד הזדמנות אחת.'],
  bribeTarget:['שמעתי שמישהו שילם לך כדי שתתעלם ממני.'],
  notChosen:{doctor:'עוד זוכרת שבחרת בכלים לפני אנשים.',blacksmith:'הרופאה קודם, אה? אני זוכר.'},
  chosen:{doctor:'לא שכחתי שבחרת בחולים שלי.',blacksmith:'בחרת בי מול כולם. זה שווה משהו.'},
  gift:['המתנה הקטנה ההיא... נגעה בי.']
};
function mem(k){return S.mem[k];}
function memAdd(k,tag,d){const m=S.mem[k];if(!m)return;m.trust=clamp(m.trust+d,0,100);if(tag){m.tags.push(tag);m.hist.push({t:Math.round(S.t),ev:tag,d});if(m.hist.length>30)m.hist.shift();}}
function memAll(tag,d,except){for(const k of CH_KEYS){if(k===except)continue;const st=S.chars[k].state;if(st==='left')continue;memAdd(k,tag,d);}}
function trustAvg(){let s=0,n=0;for(const k of CH_KEYS){if(S.chars[k].state==='left')continue;s+=S.mem[k].trust;n++;}return n?s/n:50;}
function memLine(k){const m=S.mem[k];const tags=m.tags;const last=tags[tags.length-1];
  if(tags.includes('bribeTarget')&&!m.saidBribe){m.saidBribe=1;return MEM_LINES.bribeTarget[0];}
  if(last==='notChosen'||last==='chosen'){const L=MEM_LINES[last][k];if(L)return L;}
  if(last==='gift')return MEM_LINES.gift[0];
  if(last&&MEM_LINES[last]&&Array.isArray(MEM_LINES[last]))return pick(MEM_LINES[last]);
  return null;}
function trustWord(k){const t=S.mem[k].trust;return t>=75?'סומך עליך לגמרי':t>=55?'סומך עליך':t>=35?'עוד מהסס':'לא סומך עליך';}

/* ---------- E. modes: challenges, daily challenge, free play ---------- */
const MODES={

/* ================= v3.2: procedural music + SFX (WebAudio only, no files) ================= */
let AUD=null,aSeed=12345;const aRnd=()=>{aSeed^=aSeed<<13;aSeed^=aSeed>>>17;aSeed^=aSeed<<5;return (aSeed>>>0)/4294967296;}; // own RNG: audio never touches the game's random stream
function audioBuild(){if(!AC||AUD)return;try{
  const m=AC.createGain();m.gain.value=.9;m.connect(AC.destination);
  const sfx=AC.createGain();sfx.connect(m);
  const mus=AC.createGain();mus.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
  const dl=AC.createDelay(1);dl.delayTime.value=.34;const fb=AC.createGain();fb.gain.value=.28;const wet=AC.createGain();wet.gain.value=.35;
  mus.connect(lp);lp.connect(m);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(m);
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=aRnd()*2-1;
  AUD={m,sfx,mus,noise:nb,next:0,bar:0,step:0,mode:'day',lvl:0};}catch(e){AUD=null;}}
const mtof=n=>440*Math.pow(2,(n-69)/12);
function sfxOn(){return AC&&AUD&&!muted&&SET.sfx!==false&&SET.vol>0;}
function aTone(f,t,d,{type='triangle',v=.05,f2=0,a=.008,bus,q=0}={}){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let out=o.connect(g);if(q){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=q;out=g.connect(fl);}
  out.connect(bus||AUD.sfx);o.start(t);o.stop(t+d+.03);}
function noise(t,d,{v=.05,f=1200,type='bandpass',Q=.8,a=.05,f2=0,bus}={}){
  const s=AC.createBufferSource();s.buffer=AUD.noise;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=Q;
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl).connect(g).connect(bus||AUD.sfx);s.start(t,aRnd());s.stop(t+d+.05);}
const SFXLAST={};
function sfx(n){if(!sfxOn())return;const now=performance.now();if(SFXLAST[n]&&now-SFXLAST[n]<70)return;SFXLAST[n]=now;
  const t=AC.currentTime+.005,V=SET.vol;try{switch(n){
  case 'bakeStart':noise(t,.45,{v:.035*V,f:500,f2:1400,Q:.6,a:.12});aTone(110,t,.35,{type:'sine',v:.03*V});break;            // oven whoosh
  case 'bakeDone':aTone(1318,t,.5,{v:.035*V});aTone(1976,t+.06,.45,{type:'sine',v:.02*V});break;                                // little bell
  case 'serve':aTone(660,t,.12,{v:.04*V});aTone(880,t+.07,.16,{v:.04*V});break;
  case 'coin':aTone(1568,t,.09,{type:'square',v:.018*V,q:4000});aTone(2093,t+.06,.18,{type:'square',v:.016*V,q:4000});break;
  case 'tip':[1568,2093,2637].forEach((f,i)=>aTone(f,t+i*.06,.2,{type:'sine',v:.03*V}));break;
  case 'upgrade':[523,659,784,1046].forEach((f,i)=>aTone(f,t+i*.08,.3,{v:.045*V}));noise(t+.3,.5,{v:.02*V,f:6000,type:'highpass'});break;
  case 'unlock':[392,523,659,784].forEach((f,i)=>aTone(f,t+i*.07,.35,{v:.045*V}));aTone(1046,t+.3,.6,{type:'sine',v:.035*V});break;
  case 'open':aTone(523,t,.18,{type:'sine',v:.03*V});aTone(784,t+.05,.25,{type:'sine',v:.025*V});break;
  case 'dev':aTone(147,t,.6,{type:'sawtooth',v:.025*V,q:700});aTone(156,t,.6,{type:'sawtooth',v:.02*V,q:700});break;           // ominous low cluster
  case 'choice':aTone(660,t,.07,{v:.04*V});break;

    const [root,mn]=PROG[mode][AUD.bar%4],third=root+(mn?3:4),fifth=root+7,cyc=Math.floor(AUD.bar/8)%2;

const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;

/* block browser gestures: pinch-zoom, double-tap zoom, long-press menus, text selection, drag ghosts, pull-to-refresh */
['gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||!(e.target.closest&&e.target.closest('.card')))e.preventDefault();},{passive:false});

/* audio: iOS/Android only allow WebAudio after a user gesture -> unlock (and re-resume after background) on any touch */
function unlockAudio(){initAudio();if(!AC||AC.state==='running')return;try{AC.resume();const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);}catch(e){}}
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));

/* haptics: Capacitor Haptics in the app, navigator.vibrate on Android web, nothing on iOS Safari. Off when sound is muted. */
let lastHap=0;
function haptic(kind){if(muted)return;const n=performance.now();if(n-lastHap<90)return;lastHap=n;
  try{const H=PL('Haptics');if(H){if(kind==='notify')H.notification({type:'SUCCESS'});else H.impact({style:kind==='medium'?'MEDIUM':'LIGHT'});}
    else if(navigator.vibrate&&!IS_IOS)navigator.vibrate(kind==='notify'?[12,40,12]:kind==='medium'?18:8);}catch(e){}}
{const _c=complete;complete=function(){haptic('light');return _c.apply(this,arguments);};
 const _u=unlock;unlock=function(){haptic('medium');return _u.apply(this,arguments);};
 const _f=confetti;confetti=function(){haptic('notify');return _f.apply(this,arguments);};}

/* back button (Android): game -> pause menu -> "exit?" confirm -> exit. Story dialogs ignore back (no accidental choices). */
const mTitle=()=>{const h=$('mCard').querySelector('h2');return h?h.textContent:'';};
function exitApp(){try{if(S&&started)save();}catch(e){}const A=PL('App');if(A)A.exitApp();}
function exitConfirm(){modal('<h2>לצאת מהמשחק?</h2><p>ההתקדמות נשמרה — תמשיך בדיוק מאותה נקודה.</p>',[{t:'המשך לשחק',fn:()=>{}},{t:'יציאה',cls:'bad',fn:exitApp}]);}
function onBack(){
  if(modalOpen){const t=mTitle();if(t==='הפסקה'){closeModal();exitConfirm();}else if(t==='לצאת מהמשחק?')exitApp();return;}
  if(!started||(S&&S.ended)){exitApp();return;}
  pauseMenu();
}
const CApp=PL('App');
if(CApp){CApp.addListener('backButton',onBack);CApp.addListener('pause',goBackground);CApp.addListener('resume',()=>{lastT=performance.now();});}
else if(STANDALONE&&/Android/i.test(navigator.userAgent)){try{history.pushState({lv:1},'');addEventListener('popstate',()=>{history.pushState({lv:1},'');if(!modalOpen&&started)pauseMenu();});}catch(e){}}

/* native chrome: hide status bar, portrait lock on web where allowed */
{const SB=PL('StatusBar');if(SB){try{SB.setOverlaysWebView({overlay:true});SB.hide();}catch(e){}}}
try{if(!NATIVE&&STANDALONE&&screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(()=>{});}catch(e){}

/* performance watchdog: if a low-end phone can't hold ~40fps, lower render resolution (DPR) step by step */
(function(){let n=0,acc=0,last=0,steps=0;function w(t){if(last){const d=t-last;if(d<250&&started&&!paused&&!document.hidden){acc+=d;n++;}}last=t;
  if(n>=150){const avg=acc/n;n=0;acc=0;if(avg>25&&DPR>1&&steps<3){DPR_CAP=Math.max(1,Math.round((DPR-.5)*4)/4);steps++;if(steps>=2)LOWFX=true;resize();}}requestAnimationFrame(w);}requestAnimationFrame(w);})();

/* PWA: offline service worker (only on https/localhost web, not inside the native app) */
if('serviceWorker' in navigator&&!NATIVE&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}

/* one-time install hint for iPhone Safari users */
try{if(IS_IOS&&!STANDALONE&&!NATIVE&&!localStorage.getItem('lv_a2hs')){localStorage.setItem('lv_a2hs','1');setTimeout(()=>{if(!modalOpen)toast('טיפ: להתקנה כאפליקציה — כפתור השיתוף ⬆️ ואז "הוסף למסך הבית"',5.5);},9000);}}catch(e){}
window.__LV.platform={NATIVE,IS_IOS,STANDALONE,get DPR(){return DPR;},onBack,haptic};
</script>
